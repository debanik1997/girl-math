<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="logo">🧮</span>
        <div class="brand-text">
          <h1>girl math</h1>
          <p>shopping, justified</p>
        </div>
      </div>
      <span class="proto">proto</span>
    </header>

    <div id="empty" hidden>
      <div class="empty-art">🛍️</div>
      <p class="empty-title">No product detected yet</p>
      <p class="muted">Open a product page on Amazon, Best&nbsp;Buy, Target, Nike, or Sephora — then click the extension icon.</p>
    </div>

    <div id="main" hidden>
      <section class="card result">
        <div class="result-label" id="r-label">girl math price</div>
        <div class="result-price" id="r-price"></div>
        <div class="result-sub" id="r-sub"></div>
      </section>

      <section class="card product">
        <div class="product-title" id="p-title"></div>
        <div class="product-meta">
          <span class="merchant-chip" id="p-merchant"></span>
          <span class="price" id="p-price"></span>
        </div>
      </section>

      <section class="card">
        <h2>how it adds up</h2>
        <div id="lines"></div>
      </section>

      <section class="card">
        <h2>bundle it <span class="hint">optional</span></h2>
        <div id="bundles"></div>
      </section>

      <button id="copy" class="btn">copy receipt</button>
      <p class="fine" id="fine"></p>
    </div>
  </div>

  <script src="deals.js"></script>
  <script src="popup.js"></script>
</body>
</html>
